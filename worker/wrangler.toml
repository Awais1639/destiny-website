# Live university lookup for the "Ask Destiny" assistant. Deployed by .github/workflows/worker.yml.
name = "destiny-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"
account_id = "df63f3892a917e28b91a707bc5a3d4af"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://destinyglobals.com,https://www.destinyglobals.com"

[ai]
binding = "AI"

# Answer cache. The id is filled in automatically by the deploy workflow.
[[kv_namespaces]]
binding = "CACHE"
id = "__KV_ID__"

# At most 10 questions per minute from one visitor.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
