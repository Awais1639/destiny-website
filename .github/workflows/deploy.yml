# Builds the site and publishes it to Hostinger (destinyglobals.com) over FTPS.
# Runs on every push to main and can also be started by hand (Actions → Deploy → Run workflow).
# Uses the upload-only FTP account "githubdeploy" (hPanel → Files → FTP Accounts), whose home folder is
# public_html. Its password is the repository secret FTP_PASSWORD (Settings → Secrets and variables → Actions).
# Only files this workflow uploaded are ever replaced or removed; other folders in public_html
# (for example "search", the search.destinyglobals.com site) are left alone.
#
# Hostinger drops FTPS sessions after roughly an hour, so the upload is split into four parts.
# Each part runs as its own job, one after another, with its own sync-state file, so a part that
# finishes is remembered even if a later part fails. Re-run only the failed part with
# "Re-run failed jobs" (or: gh run rerun <id> --failed).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      site: ${{ steps.fp.outputs.site }}
      other: ${{ steps.fp.outputs.other }}
      italy: ${{ steps.fp.outputs.italy }}
      us: ${{ steps.fp.outputs.us }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blog photos (free Unsplash/Pexels images named in each post) are downloaded here and served from our own site.
      - uses: actions/cache@v4
        with:
          path: |
            public/blog-img
            .blog-img-src
          key: blog-img-${{ hashFiles('src/blog/*.md') }}
          restore-keys: blog-img-
      - run: node scripts/fetch-blog-images.mjs
      # Validators run first; if any record is invalid the site is NOT published.
      - run: npm run build
        env:
          SITE_URL: https://destinyglobals.com
      # Fingerprint of each part's files. A part whose files are identical to the last successful upload is
      # skipped (saves GitHub Actions minutes: the university parts take up to an hour each).
      - id: fp
        run: |
          fp() { (cd dist && find "$@" -type f -print0 | sort -z | xargs -0 sha256sum) | sha256sum | cut -c1-40; }
          echo "site=always" >> "$GITHUB_OUTPUT"
          echo "other=$(fp universities -not -path 'universities/italy/*' -not -path 'universities/united-states/*')" >> "$GITHUB_OUTPUT"
          echo "italy=$(fp universities/italy)" >> "$GITHUB_OUTPUT"
          echo "us=$(fp universities/united-states)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        part:
          - name: site (everything except universities)
            id: site
            local: ./dist/
            server: ./
            state: .deploy-state-site.json
            exclude: |
              **/.git*
              **/.git*/**
              universities/**
          - name: universities (other countries)
            id: other
            local: ./dist/universities/
            server: ./universities/
            state: .deploy-state-universities.json
            exclude: |
              **/.git*
              **/.git*/**
              united-states/**
              italy/**
          - name: universities (Italy)
            id: italy
            local: ./dist/universities/italy/
            server: ./universities/italy/
            state: .deploy-state-italy.json
            exclude: |
              **/.git*
              **/.git*/**
          - name: universities (United States)
            id: us
            local: ./dist/universities/united-states/
            server: ./universities/united-states/
            state: .deploy-state-us.json
            exclude: |
              **/.git*
              **/.git*/**
    name: Publish — ${{ matrix.part.name }}
    env:
      FP: ${{ needs.build.outputs[matrix.part.id] }}
    steps:
      - name: Unchanged since the last upload?
        id: same
        if: env.FP != 'always'
        uses: actions/cache/restore@v4
        with:
          path: .uploaded
          key: uploaded-${{ matrix.part.id }}-${{ env.FP }}
          lookup-only: true
      - if: steps.same.outputs.cache-hit == 'true'
        run: echo "No changes in this part since the last successful upload — skipped."
      - uses: actions/download-artifact@v4
        if: steps.same.outputs.cache-hit != 'true'
        with:
          name: site
          path: dist/
      - name: Upload
        id: up
        if: steps.same.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.destinyglobals.com
          username: u535784529.githubdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ${{ matrix.part.local }}
          server-dir: ${{ matrix.part.server }}
          state-name: ${{ matrix.part.state }}
          exclude: ${{ matrix.part.exclude }}
      # Hostinger sometimes drops FTPS sessions ("Server sent FIN packet"); retry once automatically.
      - name: Upload (retry)
        id: retry
        if: steps.up.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.destinyglobals.com
          username: u535784529.githubdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ${{ matrix.part.local }}
          server-dir: ${{ matrix.part.server }}
          state-name: ${{ matrix.part.state }}
          exclude: ${{ matrix.part.exclude }}

      - name: Remember this upload
        if: env.FP != 'always' && steps.same.outputs.cache-hit != 'true' && (steps.up.outcome == 'success' || steps.retry.outcome == 'success')
        run: mkdir -p .uploaded && echo "$FP" > .uploaded/fp
      - if: env.FP != 'always' && steps.same.outputs.cache-hit != 'true' && (steps.up.outcome == 'success' || steps.retry.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: .uploaded
          key: uploaded-${{ matrix.part.id }}-${{ env.FP }}

  # After publishing, check the live website: pages load, HTTPS is forced, security headers are present
  # and private files are blocked. A failure here shows up as a red run in GitHub Actions.
  verify:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check live website
        run: sleep 30 && bash scripts/verify-live.sh
        env:
          INDEXNOW: '1'
