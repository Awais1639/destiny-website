# Builds the site and publishes it to Hostinger (destinyglobals.com) over FTPS.
# Runs on every push to main and can also be started by hand (Actions → Deploy → Run workflow).
# Uses the upload-only FTP account "githubdeploy" (hPanel → Files → FTP Accounts), whose home folder is
# public_html. Its password is the repository secret FTP_PASSWORD (Settings → Secrets and variables → Actions).
# Only files this workflow uploaded are ever replaced or removed; other folders in public_html
# (for example "search", the search.destinyglobals.com site) are left alone.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validators run first; if any scholarship record is invalid the site is NOT published.
      - run: npm run build
        env:
          SITE_URL: https://destinyglobals.com
      - name: Publish to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.destinyglobals.com
          username: u535784529.githubdeploy
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
